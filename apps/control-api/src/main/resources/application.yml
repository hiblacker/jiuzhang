server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${BROWSER_COOKIE_SECURE:false}
spring:
  application:
    name: jiuzhang-control-api
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://warehouse-db:5432/warehouse}
    username: ${CONTROL_API_DB_USERNAME:bydw_control_api_login}
    password: ${CONTROL_API_DB_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
bydw:
  lake:
    calendar-driver: ${LAKE_CALENDAR_DRIVER:external}
  web:
    allowed-origins: ${CONTROL_API_ALLOWED_ORIGINS:}
  security:
    admin-token: ${CONTROL_API_ADMIN_TOKEN}
    worker-token: ${CONTROL_API_WORKER_TOKEN}
  ingestion:
    lease-duration-seconds: ${BATCH_LEASE_DURATION_SECONDS:300}

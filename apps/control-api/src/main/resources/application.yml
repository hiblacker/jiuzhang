server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: by-data-warehouse-control-api
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://warehouse-db:5432/warehouse}
    username: ${WAREHOUSE_DB_USERNAME:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

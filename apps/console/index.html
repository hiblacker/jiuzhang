<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九章数据平台 · 入湖控制台</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7fb; color: #172033; }
    body { margin: 0; }
    header { background: #12233f; color: #fff; padding: 28px max(24px, calc((100vw - 1180px) / 2)); }
    header h1 { margin: 0 0 6px; font-size: 26px; }
    header p { margin: 0; color: #c5d4ed; }
    main { max-width: 1180px; margin: 24px auto; padding: 0 24px 48px; }
    .toolbar, .card, .panel { background: #fff; border: 1px solid #dce4f0; border-radius: 12px; box-shadow: 0 4px 18px #1c31510d; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; padding: 16px; align-items: end; }
    label { display: grid; gap: 6px; color: #516078; font-size: 13px; }
    input, select, textarea { border: 1px solid #cbd6e6; border-radius: 8px; padding: 10px 11px; font: inherit; color: #172033; min-width: 0; }
    .operations { margin-top: 20px; }
    .operation-form { padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
    .operation-form .wide { grid-column: 1 / -1; }
    .small { padding: 6px 10px; margin-right: 6px; font-size: 12px; }
    .secondary { background: #52647e; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; padding: 16px; }
    details > summary { cursor: pointer; padding: 16px 18px; font-weight: 600; }
    button { border: 0; border-radius: 8px; padding: 11px 18px; background: #1769e0; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { background: #9aa9c0; cursor: wait; }
    #message { min-height: 22px; margin: 14px 2px; color: #5b6a82; }
    #message.error { color: #b42318; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0 20px; }
    .card { padding: 17px; }
    .card .label { color: #687994; font-size: 13px; }
    .card .value { margin-top: 7px; font-size: 28px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { overflow: hidden; }
    .panel h2 { font-size: 17px; margin: 0; padding: 16px 18px; border-bottom: 1px solid #e7edf5; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { text-align: left; border-bottom: 1px solid #edf1f6; padding: 11px 14px; font-size: 13px; white-space: nowrap; }
    th { color: #687994; font-weight: 600; background: #fbfcfe; }
    .state { font-weight: 650; }
    .state.COMPLETE, .state.RECEIVED, .state.RAW_COMMITTED { color: #087443; }
    .state.FAILED, .state.MISSING, .state.OVERDUE { color: #b42318; }
    .empty { padding: 28px 18px; color: #75849c; }
    @media (max-width: 850px) { .toolbar, .grid, .operation-form { grid-template-columns: 1fr; } .cards { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header><h1>九章 · 数据平台</h1><p>管理数据接入计划，查看交付、运行和异常。任务在后台运行，关闭页面不会中断。</p></header>
  <main>
    <form class="toolbar" id="query-form">
      <label>控制 API 地址<input id="base-url" value="http://127.0.0.1:8080" autocomplete="url"></label>
      <label>来源编码（可选）<input id="source-code" placeholder="mysql-test-source" autocomplete="off"></label>
      <label>Admin Token<input id="token" type="password" autocomplete="off"></label>
      <button id="refresh" type="submit">刷新</button>
    </form>
    <div id="message" role="status">输入 Admin Token 后刷新数据。</div>
    <section class="cards" aria-label="入湖摘要">
      <div class="card"><div class="label">系统运行</div><div class="value" id="run-count">—</div></div>
      <div class="card"><div class="label">已完成运行</div><div class="value" id="complete-count">—</div></div>
      <div class="card"><div class="label">原始对象行数</div><div class="value" id="row-count">—</div></div>
      <div class="card"><div class="label">失败对象</div><div class="value" id="failed-count">—</div></div>
    </section>
    <section class="panel operations"><h2>持续入湖计划</h2>
      <div class="table-wrap"><table><thead><tr><th>来源</th><th>计划版本</th><th>类型</th><th>每日触发</th><th>状态</th><th>操作</th></tr></thead><tbody id="plans"></tbody></table></div>
      <details><summary>新建或修改计划</summary>
        <form id="plan-form" class="operation-form">
          <label>来源<select id="plan-source" required></select></label>
          <label>接入方式<select id="plan-kind"><option value="MYSQL_SNAPSHOT">数据库全量快照</option><option value="FILE_SCAN">目录文件</option><option value="REST_PULL">REST API</option></select></label>
          <label>执行配置名<input id="runtime-ref" required placeholder="管理员在 Worker 登记的配置名"></label>
          <label>数据库清单版本<input id="inventory-version" type="number" min="1" placeholder="数据库计划必填"></label>
          <label>从哪天开始<input id="plan-start" type="date" required></label>
          <label>每日触发时间<input id="plan-time" type="time" value="02:00" required></label>
          <label>时区<select id="plan-zone"><option>Asia/Shanghai</option><option>UTC</option></select></label>
          <label>最多尝试次数<input id="plan-attempts" type="number" value="3" min="1" max="8"></label>
          <label>每次运行上限（秒）<input id="plan-timeout" type="number" value="3600" min="30" max="86400"></label>
          <label>来源允许重读过去日期<input id="historical-read" type="checkbox"></label>
          <button type="submit">保存新版本</button>
        </form>
      </details>
    </section>
    <section class="panel operations"><h2>运行与恢复</h2>
      <form id="trigger-form" class="operation-form">
        <label>计划<select id="trigger-plan" required></select></label>
        <label>业务日期<input id="trigger-day" type="date" required></label>
        <label>原因<input id="trigger-reason" value="手工触发" maxlength="300" required></label>
        <label>为已交付日期生成新修订<input id="trigger-revision" type="checkbox"></label>
        <button type="submit">触发运行</button><button id="reconcile" type="button" class="secondary">检查遗漏窗口</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>来源</th><th>日期</th><th>尝试</th><th>状态</th><th>错误</th><th>操作</th></tr></thead><tbody id="executions"></tbody></table></div>
    </section>
    <section class="panel operations"><h2>应交付窗口</h2><div class="table-wrap"><table><thead><tr><th>来源</th><th>日期</th><th>修订</th><th>状态</th><th>说明</th></tr></thead><tbody id="windows"></tbody></table></div></section>
    <details class="panel operations"><summary>登记来源</summary><form id="source-form" class="operation-form">
      <label>来源编码<input id="new-source" required pattern="[a-z][a-z0-9_-]{2,99}"></label>
      <label>类型<select id="new-source-type"><option>MYSQL</option><option>FILE</option><option>REST</option></select></label>
      <label>凭证引用<input id="credential-ref" required placeholder="env://VARIABLE_NAME"></label>
      <button type="submit">登记</button>
    </form></details>
    <details class="panel operations" id="detail-panel"><summary>操作详情</summary><pre id="detail">选择运行的“详情”查看结果。</pre></details>
    <section class="grid">
      <div class="panel"><h2>最近系统运行</h2><div class="table-wrap"><table><thead><tr><th>来源</th><th>模式</th><th>窗口</th><th>状态</th><th>错误</th></tr></thead><tbody id="runs"><tr><td colspan="5" class="empty">暂无数据</td></tr></tbody></table></div></div>
      <div class="panel"><h2>每日交付账本</h2><div class="table-wrap"><table><thead><tr><th>来源</th><th>类型</th><th>窗口</th><th>状态</th><th>接收时间</th></tr></thead><tbody id="deliveries"><tr><td colspan="5" class="empty">暂无数据</td></tr></tbody></table></div></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let currentPlans = [];
    const text = (value) => value === null || value === undefined || value === '' ? '—' : String(value);
    function cell(row, value, className = '') { const td = document.createElement('td'); td.textContent = text(value); if (className) td.className = className; row.appendChild(td); }
    function drawRows(target, rows, columns) {
      target.replaceChildren();
      if (!rows.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = columns.length; td.className = 'empty'; td.textContent = '暂无数据'; tr.appendChild(td); target.appendChild(tr); return; }
      for (const item of rows) { const tr = document.createElement('tr'); for (const column of columns) cell(tr, item[column.key], column.state ? `state ${item[column.key]}` : ''); target.appendChild(tr); }
    }
    function baseUrl() {
      const url = new URL($('base-url').value.trim());
      if (url.username || url.password || url.search || url.hash || (url.protocol !== 'https:' && !(url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)))) throw new Error('控制 API 需要 HTTPS；本机允许 HTTP');
      return url.toString().replace(/\/+$/, '');
    }
    async function api(route, body) {
      const response = await fetch(`${baseUrl()}/api/v1/${route}`, { method: body === undefined ? 'GET' : 'POST',
        headers: { Authorization: `Bearer ${$('token').value}`, 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body), redirect: 'error', signal: AbortSignal.timeout(15000) });
      const value = await response.json();
      if (!response.ok) throw new Error(value.code || `API_${response.status}`);
      return value;
    }
    function actionButton(row, label, action) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'small'; button.textContent = label;
      button.addEventListener('click', () => perform(button, action)); row.appendChild(button);
    }
    async function perform(button, action) {
      if (button) button.disabled = true;
      try { const result = await action(); $('detail').textContent = JSON.stringify(result, null, 2); $('detail-panel').open = true; await load(); }
      catch (error) { $('message').className = 'error'; $('message').textContent = `操作未完成：${error.message}`; }
      finally { if (button) button.disabled = false; }
    }
    function populate(select, rows, key, label) {
      const selected = select.value; select.replaceChildren();
      for (const row of rows) { const option = document.createElement('option'); option.value = row[key]; option.textContent = row[label]; select.appendChild(option); }
      if (rows.some(row => String(row[key]) === selected)) select.value = selected;
    }
    function drawOperations(plans, executions) {
      $('plans').replaceChildren();
      for (const plan of plans) {
        const tr = document.createElement('tr'); for (const value of [plan.source_code, plan.active_version, plan.kind, `${plan.trigger_time} ${plan.timezone}`, plan.state]) cell(tr, value);
        const actions = document.createElement('td');
        actionButton(actions, plan.state === 'ACTIVE' ? '暂停' : '恢复', () => api(`lake/plans/${plan.id}/state`, { state: plan.state === 'ACTIVE' ? 'PAUSED' : 'ACTIVE' }));
        tr.appendChild(actions); $('plans').appendChild(tr);
      }
      $('executions').replaceChildren();
      for (const execution of executions) {
        const tr = document.createElement('tr'); for (const value of [execution.source_code, execution.business_date, execution.attempt, execution.state, execution.error_code]) cell(tr, value);
        const actions = document.createElement('td');
        if (['FAILED', 'INCOMPLETE', 'CANCELLED'].includes(execution.state)) actionButton(actions, '重试', () => api(`lake/executions/${execution.id}/retry`, {}));
        if (['QUEUED', 'RUNNING'].includes(execution.state)) actionButton(actions, '取消', () => api(`lake/executions/${execution.id}/cancel`, {}));
        actionButton(actions, '详情', async () => execution); tr.appendChild(actions); $('executions').appendChild(tr);
      }
    }
    async function load(event) {
      event?.preventDefault();
      const source = $('source-code').value.trim();
      const query = source ? `?sourceCode=${encodeURIComponent(source)}` : '';
      const listQuery = source ? `${query}&limit=50` : '?limit=50';
      const button = $('refresh'); button.disabled = true; $('message').className = ''; $('message').textContent = '正在读取控制 API…';
      try {
        const [summary, runs, deliveries, plans, windows, executions, sources] = await Promise.all([
          api(`lake/summary${query}`), api(`lake/runs${listQuery}`), api(`lake/deliveries${listQuery}`),
          api('lake/plans'), api('lake/windows'), api('lake/executions'), api('sources?limit=100&offset=0')
        ]);
        const runStats = summary.runs || {}; const objectStats = summary.objects || {};
        $('run-count').textContent = text(runStats.run_count); $('complete-count').textContent = text(runStats.complete_count); $('row-count').textContent = text(objectStats.row_count); $('failed-count').textContent = text(objectStats.failed_object_count);
        drawRows($('runs'), runs, [{ key: 'source_code' }, { key: 'mode' }, { key: 'scheduled_window_start' }, { key: 'state', state: true }, { key: 'error_code' }]);
        drawRows($('deliveries'), deliveries, [{ key: 'source_code' }, { key: 'delivery_kind' }, { key: 'scheduled_window_start' }, { key: 'observed_state', state: true }, { key: 'received_at' }]);
        currentPlans = plans;
        populate($('plan-source'), sources.items || [], 'code', 'code'); populate($('trigger-plan'), plans, 'id', 'source_code');
        const visible = rows => source ? rows.filter(row => row.source_code === source) : rows;
        drawOperations(visible(plans), visible(executions));
        drawRows($('windows'), visible(windows), [{ key: 'source_code' }, { key: 'business_date' }, { key: 'revision' }, { key: 'state', state: true }, { key: 'reason' }]);
        $('message').textContent = `已更新 ${new Date().toLocaleString('zh-CN')}`;
      } catch (error) { $('message').className = 'error'; $('message').textContent = `读取失败：${error.message || 'API_REQUEST_FAILED'}`; }
      finally { button.disabled = false; }
    }
    $('query-form').addEventListener('submit', load);
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date());
    $('plan-start').value = today; $('trigger-day').value = today;
    $('source-form').addEventListener('submit', event => { event.preventDefault(); perform(event.submitter, () => api('sources', { code: $('new-source').value, sourceType: $('new-source-type').value, credentialRef: $('credential-ref').value, config: {} })); });
    $('plan-form').addEventListener('submit', event => { event.preventDefault(); perform(event.submitter, () => {
      const sourceCode = $('plan-source').value; const previous = currentPlans.find(plan => plan.source_code === sourceCode);
      return api('lake/plans', { sourceCode, expectedVersion: previous?.active_version || 0, kind: $('plan-kind').value,
        runtimeRef: $('runtime-ref').value, inventoryVersion: $('inventory-version').value ? Number($('inventory-version').value) : null,
        timezone: $('plan-zone').value, triggerTime: $('plan-time').value + ':00', startDate: $('plan-start').value,
        historicalRead: $('historical-read').checked, maxAttempts: Number($('plan-attempts').value), timeoutSeconds: Number($('plan-timeout').value), contract: {} });
    }); });
    $('trigger-form').addEventListener('submit', event => { event.preventDefault(); perform(event.submitter, () => api(`lake/plans/${$('trigger-plan').value}/trigger`, { day: $('trigger-day').value, revision: $('trigger-revision').checked, reason: $('trigger-reason').value })); });
    $('reconcile').addEventListener('click', event => perform(event.target, () => api('lake/calendar/reconcile', {})));
  </script>
</body>
</html>

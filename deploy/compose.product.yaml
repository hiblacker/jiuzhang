services:
  warehouse-db:
    image: docker.m.daocloud.io/library/postgres:16.15
    platform: linux/amd64
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?required}
    ports: ["127.0.0.1:${PRODUCT_DB_PORT:-57224}:5432"]
    volumes: ["product-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: docker.m.daocloud.io/library/postgres:16.15
    platform: linux/amd64
    environment:
      PGHOST: warehouse-db
      PGDATABASE: warehouse
      PGUSER: warehouse
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD:?required}
    volumes: ["../migrations:/migrations:ro", "./scripts/migrate.sh:/scripts/migrate.sh:ro"]
    command: ["bash", "/scripts/migrate.sh"]
    depends_on:
      warehouse-db: {condition: service_healthy}
  provision-roles:
    image: docker.m.daocloud.io/library/postgres:16.15
    platform: linux/amd64
    environment:
      PGHOST: warehouse-db
      PGDATABASE: warehouse
      PGUSER: warehouse
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD:?required}
      CONTROL_API_DB_PASSWORD: ${CONTROL_API_DB_PASSWORD:?required}
      INGESTION_WORKER_DB_PASSWORD: ${INGESTION_WORKER_DB_PASSWORD:?required}
      MODEL_WORKER_DB_PASSWORD: ${MODEL_WORKER_DB_PASSWORD:?required}
    volumes: ["./scripts/provision-roles.sh:/scripts/provision-roles.sh:ro"]
    command: ["bash", "/scripts/provision-roles.sh"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  control-api:
    hostname: jiuzhang-product-api
    image: jiuzhang/control-api:0.1.0-dev.17
    platform: linux/amd64
    environment:
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-db:5432/warehouse
      CONTROL_API_DB_USERNAME: bydw_control_api_login
      CONTROL_API_DB_PASSWORD: ${CONTROL_API_DB_PASSWORD:?required}
      CONTROL_API_ADMIN_TOKEN: ${CONTROL_API_ADMIN_TOKEN:?required}
      CONTROL_API_WORKER_TOKEN: ${CONTROL_API_WORKER_TOKEN:?required}
      CONTROL_API_ALLOWED_ORIGINS: http://127.0.0.1:${PRODUCT_CONSOLE_PORT:-60284}
      LAKE_CALENDAR_DRIVER: local
    ports: ["127.0.0.1:${PRODUCT_API_PORT:-60283}:8080", "127.0.0.1:${PRODUCT_CONSOLE_PORT:-60284}:8081"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      provision-roles: {condition: service_completed_successfully}
  lake-worker:
    image: jiuzhang/product-worker:0.1.0-dev.4
    platform: linux/amd64
    user: "${PRODUCT_UID:?required}:${PRODUCT_GID:?required}"
    network_mode: service:control-api
    environment:
      CONTROL_API_WORKER_TOKEN: ${CONTROL_API_WORKER_TOKEN:?required}
      LAKE_TEST_TLS_AUTHORIZATION_FILE: /run/secrets/mysql-development-tls-authorization.local.json
    env_file:
      - ${PRODUCT_CONFIG_ROOT:?required}/source.env
    volumes:
      - ${PRODUCT_LAKE_ROOT:?required}:/data/lake
      - ${PRODUCT_INBOX_ROOT:?required}:/data/inbox:ro
      - ${PRODUCT_CONFIG_ROOT:?required}:/run/secrets:ro
    depends_on:
      control-api: {condition: service_healthy}
    restart: unless-stopped
  model-worker:
    image: jiuzhang/product-worker:0.1.0-dev.4
    platform: linux/amd64
    user: "${PRODUCT_UID:?required}:${PRODUCT_GID:?required}"
    network_mode: service:control-api
    environment:
      CONTROL_API_WORKER_TOKEN: ${CONTROL_API_WORKER_TOKEN:?required}
      MODEL_DATABASE_PASSWORD: ${MODEL_WORKER_DB_PASSWORD:?required}
      HOME: /tmp
    command: ["python", "/app/apps/model-worker/worker.py", "--registry", "/run/secrets/model-runtime.json", "--api", "http://127.0.0.1:8080", "--instance", "model-worker"]
    volumes:
      - ${PRODUCT_LAKE_ROOT:?required}:/data/lake
      - ${PRODUCT_CONFIG_ROOT:?required}/model-runtime.json:/run/secrets/model-runtime.json:ro
    depends_on:
      control-api: {condition: service_healthy}
    restart: unless-stopped
  console:
    image: jiuzhang/console:0.2.0-dev.1
    platform: linux/amd64
    network_mode: service:control-api
    environment:
      CONSOLE_API_ORIGIN: http://127.0.0.1:8080
    depends_on:
      control-api: {condition: service_healthy}
volumes:
  product-db-data:

services:
  warehouse-db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:16.15
    environment:
      PGHOST: warehouse-db
      PGDATABASE: warehouse
      PGUSER: warehouse
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD}
    volumes:
      - ../migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    command: ["/bin/bash", "/scripts/migrate.sh"]
    depends_on:
      warehouse-db:
        condition: service_healthy
  provision-roles:
    image: postgres:16.15
    environment:
      PGHOST: warehouse-db
      PGDATABASE: warehouse
      PGUSER: warehouse
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD}
      CONTROL_API_DB_PASSWORD: ${CONTROL_API_DB_PASSWORD:?set CONTROL_API_DB_PASSWORD}
      INGESTION_WORKER_DB_PASSWORD: ${INGESTION_WORKER_DB_PASSWORD:?set INGESTION_WORKER_DB_PASSWORD}
    volumes:
      - ./scripts/provision-roles.sh:/scripts/provision-roles.sh:ro
    command: ["/bin/bash", "/scripts/provision-roles.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  control-api:
    image: jiuzhang/control-api:0.1.0-dev.15
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      CONTROL_API_DB_USERNAME: bydw_control_api_login
      CONTROL_API_DB_PASSWORD: ${CONTROL_API_DB_PASSWORD:?set CONTROL_API_DB_PASSWORD}
      CONTROL_API_ADMIN_TOKEN: ${CONTROL_API_ADMIN_TOKEN:?set CONTROL_API_ADMIN_TOKEN}
      CONTROL_API_WORKER_TOKEN: ${CONTROL_API_WORKER_TOKEN:?set CONTROL_API_WORKER_TOKEN}
      CONTROL_API_ALLOWED_ORIGINS: ${CONTROL_API_ALLOWED_ORIGINS:-}
      LAKE_CALENDAR_DRIVER: ${LAKE_CALENDAR_DRIVER:-external}
      BATCH_LEASE_DURATION_SECONDS: ${BATCH_LEASE_DURATION_SECONDS:-300}
    ports:
      - "${CONTROL_API_PORT:-8080}:8080"
    depends_on:
      provision-roles:
        condition: service_completed_successfully
  ingestion-worker:
    profiles: ["worker"]
    image: jiuzhang/ingestion-worker:0.1.0-dev.2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      CONTROL_API_BASE_URL: http://control-api:8080
      CONTROL_API_WORKER_TOKEN: ${CONTROL_API_WORKER_TOKEN:?set CONTROL_API_WORKER_TOKEN}
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-db:5432/warehouse
      INGESTION_WORKER_DB_USERNAME: bydw_ingestion_worker_login
      INGESTION_WORKER_DB_PASSWORD: ${INGESTION_WORKER_DB_PASSWORD:?set INGESTION_WORKER_DB_PASSWORD}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-local-worker}
      INGESTION_JOB_ID: ${INGESTION_JOB_ID:?set INGESTION_JOB_ID}
      INGESTION_RUN_KEY: ${INGESTION_RUN_KEY:?set INGESTION_RUN_KEY}
      INGESTION_CURSOR_TO: ${INGESTION_CURSOR_TO:?set INGESTION_CURSOR_TO}
      INGESTION_FIXTURE_PATH: /fixtures/synthetic-story.jsonl
      BATCH_LEASE_DURATION_SECONDS: ${BATCH_LEASE_DURATION_SECONDS:-300}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-0}
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      control-api:
        condition: service_started
      warehouse-db:
        condition: service_healthy
volumes:
  warehouse-db-data:

# P0-a spike: can SeaTunnel be the SQL extraction execution layer?
# Isolated from the product stack: different project name, no shared volumes.
# Local synthetic fixtures only. Credentials are generated per run by run.mjs and written
# under the git-ignored work/ directory, so this file holds no password.
name: jiuzhang-st-spike

services:
  spike-mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
      MYSQL_DATABASE: spike
    volumes:
      # Both paths are generated by run.mjs into the git-ignored work/ directory, so no
      # credential is stored in this repository (same rule as poc/component). The /dev/null
      # defaults only exist so that `docker compose down` works without those variables;
      # `up` must go through run.mjs or MySQL will start without a password file.
      - ${SPIKE_INIT_FILE:-/dev/null}:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${SPIKE_ROOT_PASSWORD_FILE:-/dev/null}:/run/secrets/root_password:ro
    # Same server-side charset/timezone pinning as the approved POC-01 stack.
    command: [mysqld, --character-set-server=utf8mb4, --default-time-zone=+08:00]
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -uroot -p"$$MYSQL_ROOT_PASSWORD" >/dev/null 2>&1]
      interval: 3s
      timeout: 5s
      retries: 40

  spike-seatunnel:
    image: apache/seatunnel:2.3.13
    hostname: seatunnel
    volumes:
      - ./st/hazelcast.yaml:/opt/seatunnel/config/hazelcast.yaml:ro
      - ./jobs:/jobs:ro
      - ./out:/out
    command: [bash, -c, "/opt/seatunnel/bin/seatunnel-cluster.sh"]
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/localhost/5801"]
      interval: 5s
      timeout: 5s
      retries: 40
    ports: ["127.0.0.1:5801:5801"]   # spike only: the host driver script submits over REST
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 300
    security_opt: [no-new-privileges:true]
    depends_on:
      spike-mysql: {condition: service_healthy}
